<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Lemon Universe | TimeLines, Neuron Arena & Party Games</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e2227">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TimeLines">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var fromTheme = params.get('theme');
        var fromPalette = params.get('palette');
        var palette = 'atom';
        var mode = null;

        var raw = localStorage.getItem('lemon_theme_state');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && (parsed.palette === 'atom' || parsed.palette === 'slate')) palette = parsed.palette;
          if (parsed && (parsed.mode === 'light' || parsed.mode === 'dark')) mode = parsed.mode;
        }
        if (!mode) {
          var saved = localStorage.getItem('lemon-actions:theme');
          if (saved === 'dark' || saved === 'light') mode = saved;
        }
        if (!mode) {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (fromPalette === 'atom' || fromPalette === 'slate') palette = fromPalette;
        if (fromTheme === 'dark' || fromTheme === 'light') {
          mode = fromTheme;
        } else if (fromTheme) {
          var parts = fromTheme.split('-');
          if (parts[0] === 'atom' || parts[0] === 'slate') palette = parts[0];
          if (parts[1] === 'dark' || parts[1] === 'light') mode = parts[1];
        }

        var root = document.documentElement;
        root.setAttribute('data-theme', palette);
        root.setAttribute('data-theme-mode', mode);
        root.classList.toggle('dark', mode === 'dark');
        root.classList.toggle('light', mode === 'light');
        root.style.colorScheme = mode;
      } catch (e) {}
    })();
  </script>
  <style>
    :root,
    :root[data-theme="atom"] {
      color-scheme: light;
      --boot-bg: #e2e8f0;
      --boot-surface: #ffffff;
      --boot-surface-low: #f1f5f9;
      --boot-surface-high: #e2e8f0;
      --boot-text: #383a42;
      --boot-muted: #5c6370;
      --boot-border: rgba(15, 23, 42, 0.14);
      --boot-primary: #707600;
      --boot-primary-on: #ffffff;
      --boot-primary-soft: rgba(242, 214, 117, 0.45);
    }
    :root[data-theme="slate"] {
      color-scheme: light;
      --boot-bg: #f8fafc;
      --boot-surface: #ffffff;
      --boot-surface-low: #f1f5f9;
      --boot-surface-high: #e2e8f0;
      --boot-text: #0f172a;
      --boot-muted: #475569;
      --boot-border: rgba(226, 232, 240, 0.85);
      --boot-primary: #2481cc;
      --boot-primary-on: #ffffff;
      --boot-primary-soft: rgba(36, 129, 204, 0.12);
    }
    html.dark,
    html[data-theme="atom"].dark {
      color-scheme: dark;
      --boot-bg: #1b1d23;
      --boot-surface: #242830;
      --boot-surface-low: #1e2227;
      --boot-surface-high: #282c34;
      --boot-text: #9da5b4;
      --boot-muted: #7e8796;
      --boot-border: rgba(255, 255, 255, 0.06);
      --boot-primary: #e5c07b;
      --boot-primary-on: #1e2227;
      --boot-primary-soft: rgba(229, 192, 123, 0.14);
    }
    html[data-theme="slate"].dark {
      color-scheme: dark;
      --boot-bg: #0e1621;
      --boot-surface: #18222d;
      --boot-surface-low: #1f2b38;
      --boot-surface-high: #273544;
      --boot-text: #e2e8f0;
      --boot-muted: #94a3b8;
      --boot-border: rgba(255, 255, 255, 0.08);
      --boot-primary: #2481cc;
      --boot-primary-on: #ffffff;
      --boot-primary-soft: rgba(36, 129, 204, 0.16);
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--boot-bg);
      color: var(--boot-text);
      font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .lp-boot-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--boot-bg);
      color: var(--boot-text);
    }
    .lp-boot-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--boot-surface);
      border-bottom: 1px solid var(--boot-border);
    }
    .lp-boot-topbar {
      max-width: 80rem;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .lp-boot-brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }
    .lp-boot-logo {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 1rem;
      background-color: var(--boot-primary);
      color: var(--boot-primary-on);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 900;
    }
    .lp-boot-title {
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .lp-boot-badge {
      font-size: 0.625rem;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      background-color: var(--boot-primary-soft);
      color: var(--boot-primary);
      font-weight: 800;
      text-transform: uppercase;
    }
    .lp-boot-sub {
      font-size: 0.625rem;
      color: var(--boot-muted);
    }
    .lp-boot-pill {
      padding: 0.375rem 0.875rem;
      border-radius: 0.75rem;
      background-color: var(--boot-surface-low);
      border: 1px solid var(--boot-border);
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .lp-boot-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background-color: #10b981;
      animation: lp-pulse 1.2s infinite ease-in-out;
    }
    .lp-boot-nav {
      max-width: 80rem;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      border-top: 1px solid var(--boot-border);
      padding: 0.5rem 1.5rem;
      display: flex;
      gap: 0.5rem;
      overflow: hidden;
    }
    .lp-boot-tab {
      height: 2rem;
      width: 7.5rem;
      border-radius: 0.75rem;
      background-color: var(--boot-surface-low);
      animation: lp-shimmer 1.4s infinite ease-in-out;
    }
    .lp-boot-tab.active {
      background-color: var(--boot-primary);
      opacity: 0.85;
    }
    .lp-boot-main {
      flex: 1;
      max-width: 80rem;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .lp-boot-hero {
      border-radius: 1.5rem;
      background: linear-gradient(90deg, var(--boot-primary-soft), var(--boot-surface-low));
      border: 1px solid var(--boot-border);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .lp-boot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .lp-boot-card {
      height: 15rem;
      border-radius: 1.5rem;
      background-color: var(--boot-surface);
      border: 1px solid var(--boot-border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: lp-shimmer 1.4s infinite ease-in-out;
    }
    @keyframes lp-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.88); }
    }
    @keyframes lp-shimmer {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.55; }
    }
  </style>
</head>
<body class="bg-background font-body-md text-on-surface antialiased transition-colors duration-200 selection:bg-primary-container selection:text-on-primary-container">
  <app-root>
    <div class="lp-boot-shell" aria-busy="true" aria-label="Загрузка Lemon Universe">
      <header class="lp-boot-header">
        <div class="lp-boot-topbar">
          <div class="lp-boot-brand">
            <div class="lp-boot-logo">🍋</div>
            <div>
              <div class="lp-boot-title">
                <span>Lemon Universe</span>
                <span class="lp-boot-badge">Game</span>
              </div>
              <div class="lp-boot-sub">universe.lemon.app · standalone</div>
            </div>
          </div>
          <div class="lp-boot-pill">
            <span class="lp-boot-dot"></span>
            <span>Подключение комнаты…</span>
          </div>
        </div>
        <div class="lp-boot-nav">
          <div class="lp-boot-tab active"></div>
          <div class="lp-boot-tab"></div>
          <div class="lp-boot-tab"></div>
          <div class="lp-boot-tab"></div>
          <div class="lp-boot-tab"></div>
        </div>
      </header>
      <main class="lp-boot-main">
        <section class="lp-boot-hero">
          <div style="font-size: 0.75rem; font-weight: 800; color: var(--boot-primary);">
            Lemon Universe Game Suite v2.0
          </div>
          <div style="font-size: 1.75rem; font-weight: 900; letter-spacing: -0.02em;">
            Режимы Игры &amp; Схватки
          </div>
          <div style="font-size: 0.875rem; color: var(--boot-muted); max-width: 42rem;">
            Загружаем колоду желаний, ростер из 30 героев и синхронизацию комнаты…
          </div>
        </section>
        <div class="lp-boot-grid">
          <div class="lp-boot-card"></div>
          <div class="lp-boot-card"></div>
          <div class="lp-boot-card"></div>
        </div>
      </main>
    </div>
  </app-root>
</body>
</html>
