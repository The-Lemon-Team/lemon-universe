name: lemon-universe

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: lemon-universe-postgres:latest
    container_name: lemon-universe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-lemon_universe_db}
    ports:
      - "${REMOTE_POSTGRES_PORT:-5442}:5432"
    volumes:
      - lemon_universe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon_universe_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: lemon-universe-api:latest
    container_name: lemon-universe-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REMOTE_API_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-lemon_universe_db}
      LEMON_SEASONS_URL: ${LEMON_SEASONS_URL:-http://host.docker.internal:3001}
      LEMON_SEASONS_TOKEN: ${LEMON_SEASONS_TOKEN:-lenta_adm_master_permanent_7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c}
      NO_PROXY: "localhost,127.0.0.1,postgres,host.docker.internal,192.168.1.100"
      no_proxy: "localhost,127.0.0.1,postgres,host.docker.internal,192.168.1.100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: lemon-universe-web:latest
    container_name: lemon-universe-web
    restart: unless-stopped
    ports:
      - "${REMOTE_WEB_PORT:-4210}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  lemon_universe_pgdata:
